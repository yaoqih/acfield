name: Platform CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            robot_server/pyproject.toml
      - run: python -m pip install './sdk/python[test]' './robot_server[test]'
      - name: Installed package against the actual control API
        run: python -m pytest sdk/python/tests -q
      - name: SDK type contracts
        run: python -m mypy sdk/python/src --strict
  control:
    name: Control and firmware contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot_server/pyproject.toml
      - run: python -m pip install -e './robot_server[test]' platformio==6.1.18
      - run: pio pkg install -d esp32_software/firmware -e general-driver
      - name: Backend and actual firmware parser
        working-directory: robot_server
        env:
          ACFIELD_REQUIRE_FIRMWARE_CONTRACT: "1"
        run: python -m pytest -q
      - name: Native firmware state machine
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I esp32_software/firmware/include esp32_software/firmware/test/protocol_test.cpp -o /tmp/acfield-protocol-test
          /tmp/acfield-protocol-test
  vision:
    name: Localization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-apriltag.txt
            requirements-print.txt
      - run: python -m pip install -r requirements-apriltag.txt -r requirements-print.txt pytest
      - run: python -m pytest -q tests/test_apriltag_live.py
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Regenerate the physical label artwork
        run: python generate_apriltags.py --robot-pdf output/pdf/apriltag36h11_robot104_4tags_A4.pdf
      - name: Physical label dimensions and both detection backends
        run: python verify_apriltags.py
  frontend:
    name: Console typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot_server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: robot_server/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  firmware:
    name: Four device firmware builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.18
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32_software/firmware/platformio.ini') }}
      - run: pio run -d esp32_software/firmware -e general-driver -e car-02 -e car-03 -e car-04
