[project]
name = "acfield-workspace"
version = "0.1.0"
description = "Unified development environment for the ACField platform"
requires-python = ">=3.11"
dependencies = [
  "robot-console",
  "acfield",
  "Flask>=3.0,<4",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.8,<5",
  "pupil-apriltags==1.0.4.post11",
  "Pillow>=10",
  "reportlab>=4",
  "pypdf>=5",
  "scipy>=1.12,<2",
  "trimesh>=4.5,<6",
  "manifold3d>=3,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "mypy>=1.11,<3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["robot_server", "sdk/python"]

[tool.uv.sources]
robot-console = { workspace = true }
acfield = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [".", "robot_server"]
testpaths = ["tests", "robot_server/tests"]
addopts = ["--import-mode=importlib"]
