[platformio]
default_envs = general-driver

[env:general-driver]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -Wall -Wextra

[env:car-02]
extends = env:general-driver
build_flags = ${env:general-driver.build_flags} -DROBOT_ID='"car-02"'

[env:car-03]
extends = env:general-driver
build_flags = ${env:general-driver.build_flags} -DROBOT_ID='"car-03"'

[env:car-04]
extends = env:general-driver
build_flags = ${env:general-driver.build_flags} -DROBOT_ID='"car-04"'
