[project]
name = "acfield"
version = "0.1.0"
description = "Python client for the ACField multi-robot control platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "AClab contributors"}]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://yaoqih.github.io/acfield/"
Repository = "https://github.com/yaoqih/acfield"
Documentation = "https://yaoqih.github.io/acfield/guide/python-sdk"
Issues = "https://github.com/yaoqih/acfield/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "mypy>=1.11,<3"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acfield = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
